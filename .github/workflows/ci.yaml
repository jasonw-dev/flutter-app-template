name: CI

on:
  pull_request:
  push:
    branches: [master, develop]
  # golden png 一律由 update-goldens job 產生,不在本機產(見 docs/conventions.md)。
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      # CI 上沒有 fvm,以 shim 讓 check.sh 的 `fvm <cmd>` 直通系統 flutter/dart,
      # 維持「單一腳本、兩處執行」的同構性。
      - name: Shim fvm
        run: |
          sudo tee /usr/local/bin/fvm > /dev/null <<'EOF'
          #!/usr/bin/env bash
          exec "$@"
          EOF
          sudo chmod +x /usr/local/bin/fvm

      - run: flutter pub get
      # 護欄稽核獨立跑一次(與 check.sh 內建的一步雙保險,防止 check.sh 本身被改動繞過)。
      - run: ./tool/guard.sh
      - run: ./tool/check.sh

  generator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      # CI 上沒有 fvm,以 shim 讓 `fvm <cmd>` 直通系統 flutter/dart。
      - name: Shim fvm
        run: |
          sudo tee /usr/local/bin/fvm > /dev/null <<'EOF'
          #!/usr/bin/env bash
          exec "$@"
          EOF
          sudo chmod +x /usr/local/bin/fvm

      - run: flutter pub get

      # 驗證 tool/new_feature.dart 產生器骨架可產出、可測試、可通過 analyze。
      # CI 環境用後即棄,不需還原產生的 features/smoke_probe。
      - run: fvm dart run tool/new_feature.dart smoke_probe
      # 產生器改寫了根 pubspec 的 workspace 清單,顯式 re-resolve 避免隱式 pub get 的版本差異
      - run: fvm flutter pub get
      - run: cd features/smoke_probe && fvm flutter test
      - run: fvm flutter analyze

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks 掃描完整歷史,需要全深度 checkout
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # golden png 只在 Linux 產。Flutter 的 golden 對平台的字型 rasterization
  # 敏感,macOS 與 ubuntu 產出不會 byte-identical——本機跑 --update-goldens
  # 會讓 CI 反向變紅。改畫面之後手動觸發這個 job,把 artifact 裡的 png 納入 PR。
  update-goldens:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - run: flutter pub get

      - name: Update goldens
        working-directory: app
        run: flutter test test/golden --update-goldens

      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: app/test/golden/goldens/
          if-no-files-found: error

  # 唯一能證明「App 真的能跑」的東西:把 DI、router、session、資料層串起來,
  # 在真的 Android emulator 上跑完整旅程。**不要刪掉它。**
  #
  # 只在 push 到 develop/master 時跑,不在 PR 階段跑。實測它要 6-9 分鐘,而
  # 其餘三個 job 加起來約 3 分鐘——每個 PR 都跑等於八成的 CI 時間花在這裡,
  # 連只改一行 CHANGELOG 的 PR 也要等。CI 慢到某個程度,人就會開始不等 CI
  # 就合,那時它反而失去意義。
  #
  # PR 階段仍有 check(含 golden 比對)與 generator-smoke 守著;端到端的破壞
  # 會在合進 develop 時立刻紅燈,只晚一步。
  integration:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: app
          script: flutter test integration_test
