# 依賴自動更新:pub 與 GitHub Actions。
# 更新 PR 一樣要過 CI(check + generator-smoke)才能合併。
#
# pub 只指向根目錄,不要逐一列出 workspace 成員(見 issue #42)。本 repo 是
# pub workspace:整個 workspace 只有一份解析結果與一份 pubspec.lock,都在根。
# Dependabot 的 pub 支援底層呼叫 dependency_services,它只接受在 workspace
# 根執行,清單裡只要有非根目錄,整個 job 就會失敗
# (Only apply dependency_services to the root of the workspace)。
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pub-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
